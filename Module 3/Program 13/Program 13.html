<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flexbox vs Grid</title>
  <link rel="stylesheet" href="Program 13.css" />
</head>
<body>

 
  <h2>1. Flexbox (1D Row)</h2>
  <div class="flex-box">
    <div class="item">Box 1</div>
    <div class="item">Box 2</div>
    <div class="item">Box 3</div>
    <div class="item">Box 4</div>
  </div>

 
  <h2>2. CSS Grid (2D Grid)</h2>
  <div class="grid-box">
    <div class="item">Box 1</div>
    <div class="item">Box 2</div>
    <div class="item">Box 3</div>
    <div class="item">Box 4</div>
  </div>

</body>
</html>
